apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: k8s
---
# Full access to this namespace only (built-in "admin" role, bound per namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-admin
  namespace: k8s
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: k8s
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token (K8s 1.24+ no longer creates one automatically)
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-token
  namespace: k8s
  annotations:
    kubernetes.io/service-account.name: jenkins
type: kubernetes.io/service-account-token