# Kubeconfig template for the Jenkins service account.
# Replace the <PLACEHOLDERS> (see README.md step 3). Don't commit the filled-in file.
apiVersion: v1
kind: Config
clusters:
- name: my-cluster
  cluster:
    server: <SERVER_URL>
    certificate-authority-data: <CA_DATA>
users:
- name: jenkins
  user:
    token: <TOKEN>
contexts:
- name: jenkins@my-cluster
  context:
    cluster: my-cluster
    user: jenkins
    namespace: k8s
current-context: jenkins@my-cluster
